      security:
        - bearerAuth: []
      summary: 列出会话消息
      tags:
        - 会话
    post:
      description: 默认使用 v1 的 delta、done 和 error 事件。通过 X-XA-Stream 或 stream 选择 v2 后，事件使用运行信封，可用 Last-Event-ID 从指定序号之后继续读取。
      operationId: sendConversationMessage
      parameters:
        - description: 会话 ID
          in: path
          name: conversation_id
          required: true
          schema:
            type: string
        - description: 传 2 选择 v2 事件协议
          in: query
          name: stream
          schema:
            type: string
        - description: 传 2 选择 v2 事件协议
          in: header
          name: X-XA-Stream
          schema:
            type: string
        - description: v2 发送请求的幂等键
          in: header
          name: Idempotency-Key
          schema:
            type: string
        - description: v2 已收到的最后事件序号
          in: header
          name: Last-Event-ID
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
        required: true
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StreamDelta"
                  - $ref: "#/components/schemas/StreamDone"
                  - $ref: "#/components/schemas/StreamError"
                  - additionalProperties: true
                    properties:
                      run_id:
                        type: string
                      seq:
                        format: int64
                        type: integer
                      step:
                        format: int64
                        type: integer
                      ts:
                        type: string
                      type:
                        type: string
                    required:
                      - seq
                      - run_id
                      - type
                      - ts
                    type: object
          description: SSE 事件流，Schema 描述每条事件的 data 字段
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 请求 JSON 无效（invalid_json）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话不存在（not_found）
        "409":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApiError"
                  - $ref: "#/components/schemas/WaitingApprovalResponse"
          description: 会话已有运行或正在等待审批（conflict、run_waiting_approval）
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 消息过长或幂等键无效（message_too_long、invalid_request、idempotency_key_reused）
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话服务或流式响应不可用（conversation_unavailable、stream_unsupported）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证服务不可用（unauthenticated）
      security:
        - bearerAuth: []
      summary: 发送消息并订阅回复
      tags:
        - 会话
