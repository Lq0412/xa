components:
  schemas:
    ActiveRun:
      additionalProperties: false
      properties:
        id:
          type: string
        last_event_seq:
          format: int64
          type: integer
        pending_approvals:
          items:
            $ref: "#/components/schemas/Approval"
          type:
            - array
            - "null"
        status:
          type: string
      required:
        - id
        - status
        - last_event_seq
      type: object
    ActivityItem:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        result:
          type: string
        title:
          type: string
      required:
        - title
        - result
        - created_at
        - id
      type: object
    ActivityPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ActivityItem"
          type: array
        next_cursor:
          type: string
      required:
        - items
        - next_cursor
      type: object
    AddMemoryRequest:
      additionalProperties: false
      properties:
        agent_id:
          description: Agent 范围对应的 ID
          type: string
        content:
          description: 记忆内容
          type: string
        importance:
          description: 重要性，取值 1 至 10
          format: int64
          type: integer
        kind:
          description: 记忆类型，默认 fact
          enum:
            - fact
            - preference
            - episode
            - procedure
          type: string
        namespace:
          description: 命名空间
          type: string
        pinned:
          description: 是否置顶
          type: boolean
        scope:
          description: 记忆范围，默认 user
          enum:
            - user
            - agent
          type: string
        subject_key:
          description: 主题键，省略时自动生成
          type: string
      required:
        - content
        - namespace
        - importance
      type: object
    AgentConfigResponse:
      additionalProperties: false
      properties:
        agent_id:
          type: string
        available_models:
          description: 可选择的模型
          items:
            type: string
          type: array
        config_checksum:
          type: string
        configuration:
          $ref: "#/components/schemas/Configuration"
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        id:
          type: string
        version_number:
          format: int64
          type: integer
        workspace_id:
          type: string
      required:
        - available_models
        - id
        - workspace_id
        - agent_id
        - version_number
        - configuration
        - config_checksum
        - created_by
        - created_at
      type: object
    AgentDefinition:
      additionalProperties: false
      properties:
        avatar:
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        current_version_id:
          type: string
        deleted_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          type: string
        is_default:
          type: boolean
        is_primary:
          type: boolean
        name:
          type: string
        owner_id:
          type: string
        owner_type:
          type: string
        owner_user_id:
          type: string
        status:
          type: string
        tags:
          items:
            type: string
          type:
            - array
            - "null"
        updated_at:
          format: date-time
          type: string
        visibility:
          enum:
            - public
            - private
          type: string
        workspace_id:
          type: string
      required:
        - id
        - workspace_id
        - owner_id
        - owner_type
        - current_version_id
        - name
        - avatar
        - description
        - tags
        - visibility
        - status
        - is_default
        - is_primary
        - created_by
        - created_at
        - updated_at
      type: object
    AgentListResponse:
      additionalProperties: false
      properties:
        agents:
          description: 符合当前访问条件的 Agent
          items:
            $ref: "#/components/schemas/AgentDefinition"
          type:
            - array
            - "null"
      required:
        - agents
      type: object
    AgentRequest:
      additionalProperties: false
      properties:
        agent_id:
          description: 兼容旧客户端，服务端以请求路径为准
          type: string
        avatar:
          description: 头像
          type: string
        configuration:
          additionalProperties: false
          description: 运行配置，省略字段由 Agent 服务处理
          properties:
            enable_thinking:
              type: boolean
            evaluations:
              items:
                $ref: "#/components/schemas/EvaluationBinding"
              type:
                - array
                - "null"
            knowledge:
              items:
                $ref: "#/components/schemas/KnowledgeBinding"
              type:
                - array
                - "null"
            memory_policy: {}
            model:
              type: string
            models:
              items:
                $ref: "#/components/schemas/ModelBinding"
              type:
                - array
                - "null"
            prompts:
              items:
                $ref: "#/components/schemas/Slot"
              type:
                - array
                - "null"
            runtime_limits: {}
            soul_md:
              type: string
            tools:
              items:
                $ref: "#/components/schemas/ToolBinding"
              type:
                - array
                - "null"
          type: object
        description:
          description: 描述
          type: string
        expected_version_id:
          description: 更新时用于并发校验的当前版本 ID
          type: string
        name:
          description: Agent 名称
          type: string
        tags:
          description: 标签
          items:
            type: string
          type:
            - array
            - "null"
        visibility:
          description: 可见范围
          enum:
            - public
            - private
          type: string
      required:
        - name
        - visibility
      type: object
    AgentSaveResponse:
      additionalProperties: false
      properties:
        agent:
          $ref: "#/components/schemas/AgentDefinition"
          description: 保存后的 Agent
        config_checksum:
          description: 配置校验值
          type: string
        current_version_id:
          description: 当前配置版本 ID
          type: string
        version_number:
          description: 配置版本序号
          format: int64
          type: integer
      required:
        - agent
        - current_version_id
        - version_number
        - config_checksum
      type: object
    AgentToolEntry:
      additionalProperties: false
      properties:
        approval:
          enum:
            - never
            - always
          type: string
        approval_overridable:
          type: boolean
        available:
          type: boolean
        configuration:
          description: 工具特定的生效配置
        enabled:
          type: boolean
        max_calls:
          format: int64
          type: integer
        name:
          type: string
        reason:
          type: string
        timeout_ms:
          format: int64
          type: integer
        title:
          type: string
      required:
        - name
        - title
        - enabled
        - approval
        - timeout_ms
        - max_calls
        - configuration
        - available
        - reason
        - approval_overridable
      type: object
    AgentToolsResponse:
      additionalProperties: false
      properties:
        current_version_id:
          type: string
        runtime_limits:
          $ref: "#/components/schemas/RuntimeLimits"
        tools:
          items:
            $ref: "#/components/schemas/AgentToolEntry"
          type: array
        toolset_hash:
          type: string
        version_number:
          description: 更新后返回的新版本序号
          format: int64
          type: integer
      required:
        - current_version_id
        - tools
        - runtime_limits
        - toolset_hash
      type: object
    ApiError:
      additionalProperties: false
      properties:
        code:
          description: 稳定的错误码
          type: string
        message:
          description: 错误说明
          type: string
        request_id:
          description: 请求标识
          type: string
      required:
        - code
        - message
        - request_id
      type: object
    Approval:
      additionalProperties: false
      properties:
        approval_id:
          type: string
        args_preview:
          type: string
        call_id:
          type: string
        can_remember_agent:
          type: boolean
        expires_at:
          format: date-time
          type: string
        items:
          items:
            $ref: "#/components/schemas/DisplayItem"
          type:
            - array
            - "null"
        name:
          type: string
        reason:
          type: string
        remember:
          type: string
        run_id:
          type: string
        status:
          type: string
        summary:
          type: string
        title:
          type: string
      required:
        - approval_id
        - run_id
        - call_id
        - name
        - title
        - summary
        - status
        - can_remember_agent
        - expires_at
      type: object
    ApprovalRecord:
      additionalProperties: false
      properties:
        agent:
          type: string
        agent_id:
          type: string
        conversation_id:
          type: string
        created_at:
          format: date-time
          type: string
        decider:
          type: string
        id:
          type: string
        remember:
          type: string
        run_id:
          type: string
        status:
          type: string
        summary: {}
        title: {}
        tool_name:
          type: string
        user:
          type: string
        wait_ms:
          format: int64
          type: integer
      required:
        - id
        - created_at
        - user
        - conversation_id
        - agent_id
        - agent
        - tool_name
        - title
        - summary
        - status
        - wait_ms
        - decider
        - remember
        - run_id
      type: object
    ApprovalRecordsPage:
      additionalProperties: false
      properties:
        approvals:
          items:
            $ref: "#/components/schemas/ApprovalRecord"
          type: array
        next_cursor:
          type: string
      required:
        - approvals
        - next_cursor
      type: object
    Base:
      additionalProperties: false
      properties:
        chunk_count:
          format: int64
          type: integer
        chunker_version:
          type: string
        created_at:
          format: date-time
          type: string
        description:
          type: string
        document_count:
          format: int64
          type: integer
        embed_model:
          type: string
        id:
          type: string
        name:
          type: string
        owner_user_id:
          type: string
        updated_at:
          format: date-time
          type: string
        visibility:
          enum:
            - private
            - public
          type: string
        workspace_id:
          type: string
      required:
        - id
        - workspace_id
        - owner_user_id
        - visibility
        - name
        - description
        - embed_model
        - chunker_version
        - document_count
        - chunk_count
        - created_at
        - updated_at
      type: object
    BasePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Base"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    CancelResult:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    Chunk:
      additionalProperties: false
      properties:
        char_end:
          description: 规范化文本中的 Unicode 字符终点，不包含此位置
          format: int64
          type: integer
        char_start:
          description: 规范化文本中的 Unicode 字符起点，包含此位置
          format: int64
          type: integer
        chunk_index:
          format: int64
          type: integer
        content:
          type: string
        document_id:
          type: string
        embed_model:
          type: string
        heading_path:
          items:
            type: string
          type:
            - array
            - "null"
        id:
          type: string
        knowledge_base_id:
          type: string
        page_from:
          format: int64
          type:
            - integer
            - "null"
        page_to:
          format: int64
          type:
            - integer
            - "null"
        token_count:
          description: 切片估算 token 数
          format: int64
          type: integer
      required:
        - id
        - document_id
        - knowledge_base_id
        - chunk_index
        - content
        - heading_path
        - page_from
        - page_to
        - char_start
        - char_end
        - token_count
        - embed_model
      type: object
    ChunkPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Chunk"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    Configuration:
      additionalProperties: false
      properties:
        enable_thinking:
          type: boolean
        evaluations:
          items:
            $ref: "#/components/schemas/EvaluationBinding"
          type:
            - array
            - "null"
        knowledge:
          items:
            $ref: "#/components/schemas/KnowledgeBinding"
          type:
            - array
            - "null"
        memory_policy: {}
        model:
          type: string
        models:
          items:
            $ref: "#/components/schemas/ModelBinding"
          type:
            - array
            - "null"
        prompts:
          items:
            $ref: "#/components/schemas/Slot"
          type:
            - array
            - "null"
        runtime_limits: {}
        soul_md:
          type: string
        tools:
          items:
            $ref: "#/components/schemas/ToolBinding"
          type:
            - array
            - "null"
      required:
        - soul_md
        - model
        - models
        - tools
        - knowledge
        - evaluations
        - memory_policy
        - runtime_limits
      type: object
    Conversation:
      additionalProperties: false
      properties:
        agent_id:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
        user_id:
          type: string
        workspace_id:
          type: string
      required:
        - id
        - workspace_id
        - user_id
        - agent_id
        - title
        - created_at
        - updated_at
      type: object
    ConversationList:
      additionalProperties: false
      properties:
        conversations:
          items:
            $ref: "#/components/schemas/Conversation"
          type: array
      required:
        - conversations
      type: object
    CreateInput:
      additionalProperties: false
      properties:
        description:
          maxLength: 2000
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        visibility:
          default: private
          enum:
            - private
            - public
          type: string
      required:
        - name
      type: object
    CredentialsRequest:
      additionalProperties: false
      properties:
        display_name:
          description: 注册时使用的显示名称
          type: string
        email:
          description: 账号邮箱
          type: string
        password:
          description: 账号密码
          type: string
      required:
        - email
        - password
      type: object
    DeadJob:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
        last_error_summary:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - kind
        - last_error_summary
        - updated_at
      type: object
    DecisionBody:
      additionalProperties: false
      properties:
        decision:
          enum:
            - approve
            - reject
          type: string
        reason:
          maxLength: 200
          type: string
        remember:
          enum:
            - once
            - conversation
            - agent
          type: string
      required:
        - decision
      type: object
    DecisionResult:
      additionalProperties: false
      properties:
        approval_id:
          type: string
        run_id:
          type: string
        run_status:
          type: string
        status:
          type: string
        warning:
          type: string
      required:
        - approval_id
        - status
        - run_id
        - run_status
      type: object
    DisplayItem:
      additionalProperties: false
      properties:
        label:
          type: string
        value:
          type: string
      required:
        - label
        - value
      type: object
    Document:
      additionalProperties: false
      properties:
        chunk_count:
          format: int64
          type: integer
        chunker_version:
          type: string
        content_sha256:
          type: string
        created_at:
          format: date-time
          type: string
        embed_model:
          type: string
        error_code:
          description: 摄取失败码：unsupported_file_type、invalid_file_type、invalid_utf8、file_too_large、empty_document、too_many_pages、too_many_characters、scanned_pdf、pdf_parse_failed、source_unavailable、embedding_failed、ingest_failed、delete_failed
          type: string
        error_message:
          type: string
        filename:
          type: string
        id:
          type: string
        knowledge_base_id:
          type: string
        mime:
          type: string
        owner_user_id:
          type: string
        page_count:
          format: int64
          type: integer
        ready_at:
          format: date-time
          type:
            - string
            - "null"
        size_bytes:
          format: int64
          type: integer
        status:
          enum:
            - pending
            - processing
            - ready
            - failed
            - deleting
          type: string
        title:
          type: string
        token_count:
          format: int64
          type: integer
        updated_at:
          format: date-time
          type: string
        workspace_id:
          type: string
      required:
        - id
        - workspace_id
        - knowledge_base_id
        - owner_user_id
        - title
        - filename
        - mime
        - size_bytes
        - content_sha256
        - status
        - error_code
        - error_message
        - page_count
        - chunk_count
        - token_count
        - chunker_version
        - embed_model
        - created_at
        - updated_at
        - ready_at
      type: object
    DocumentPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Document"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    EditInput:
      additionalProperties: false
      properties:
        content:
          type: string
        importance:
          format: int64
          type: integer
        namespace:
          type: string
        pinned:
          type: boolean
      required:
        - content
        - namespace
        - importance
        - pinned
      type: object
    EvaluationBinding:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        rubric_id:
          type: string
      required:
        - rubric_id
        - enabled
      type: object
    Event:
      additionalProperties: false
      properties:
        actor_id:
          type: string
        actor_type:
          type: string
        after: {}
        before: {}
        created_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        memory_id:
          type:
            - string
            - "null"
        op:
          type: string
        reason:
          type: string
        source_ref:
          type:
            - string
            - "null"
      required:
        - id
        - memory_id
        - source_ref
        - op
        - actor_type
        - actor_id
        - before
        - after
        - reason
        - created_at
      type: object
    HealthLive:
      additionalProperties: false
      properties:
        status:
          description: 进程状态
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    HealthReady:
      additionalProperties: false
      properties:
        dependencies:
          additionalProperties:
            type: string
          description: 各依赖的状态
          type: object
        status:
          description: 依赖就绪状态
          enum:
            - ok
            - unavailable
          type: string
      required:
        - status
        - dependencies
      type: object
    Item:
      additionalProperties: false
      properties:
        agent_id:
          type:
            - string
            - "null"
        content:
          type: string
        conversation_id:
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        id:
          type: string
        importance:
          format: int64
          type: integer
        kind:
          type: string
        last_used_at:
          format: date-time
          type:
            - string
            - "null"
        namespace:
          type: string
        owner_user_id:
          type: string
        pinned:
          type: boolean
        retention:
          format: double
          type: number
        scope:
          type: string
        sensitive:
          type: boolean
        source:
          type: string
        source_ref:
          type:
            - string
            - "null"
        source_type:
          type: string
        status:
          type: string
        strength_days:
          format: double
          type: number
        subject_key:
          type: string
        supersedes_id:
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
        workspace_id:
          type: string
      required:
        - id
        - workspace_id
        - owner_user_id
        - scope
        - agent_id
        - conversation_id
        - namespace
        - subject_key
        - content
        - kind
        - importance
        - pinned
        - status
        - source
        - source_type
        - source_ref
        - supersedes_id
        - created_at
        - updated_at
        - last_used_at
        - retention
        - strength_days
        - sensitive
      type: object
    KnowledgeBinding:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        filter:
          contentEncoding: base64
          type: string
        knowledge_base_id:
          type: string
      required:
        - knowledge_base_id
        - enabled
        - filter
      type: object
    LibraryListResponse:
      additionalProperties: false
      properties:
        agents:
          description: 当前用户库中可对话的 Agent
          items:
            $ref: "#/components/schemas/AgentDefinition"
          type: array
      required:
        - agents
      type: object
    LoginResponse:
      additionalProperties: false
      properties:
        token:
          description: 会话 Bearer 令牌
          type: string
        user:
          $ref: "#/components/schemas/UserResponse"
          description: 当前用户
      required:
        - token
        - user
      type: object
    MemoryEventsResponse:
      additionalProperties: false
      properties:
        events:
          description: 记忆取代链上的审计事件
          items:
            $ref: "#/components/schemas/Event"
          type:
            - array
            - "null"
      required:
        - events
      type: object
    MemoryPolicy:
      additionalProperties: false
      properties:
        core_budget_tokens:
          format: int64
          type: integer
        decay_enabled:
          type: boolean
        enabled:
          type: boolean
        history_budget_tokens:
          format: int64
          type: integer
        min_relevance:
          format: double
          type: number
        recall_top_k:
          format: int64
          type: integer
        summary_budget_tokens:
          format: int64
          type: integer
        summary_trigger_tokens:
          format: int64
          type: integer
      required:
        - enabled
        - core_budget_tokens
        - recall_top_k
        - min_relevance
        - history_budget_tokens
        - summary_trigger_tokens
        - summary_budget_tokens
        - decay_enabled
      type: object
    MemoryPolicyRequest:
      additionalProperties: false
      properties:
        core_budget_tokens:
          format: int64
          type: integer
        decay_enabled:
          type: boolean
        enabled:
          description: 是否启用记忆
          type: boolean
        expected_version_id:
          description: 当前 Agent 配置版本 ID
          type: string
        history_budget_tokens:
