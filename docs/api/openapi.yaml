components:
  schemas:
    AgentConfigResponse:
      additionalProperties: false
      properties:
        agent_id:
          type: string
        available_models:
          description: 可选择的模型
          items:
            type: string
          type: array
        config_checksum:
          type: string
        configuration:
          $ref: "#/components/schemas/Configuration"
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        id:
          type: string
        version_number:
          format: int64
          type: integer
        workspace_id:
          type: string
      required:
        - available_models
        - id
        - workspace_id
        - agent_id
        - version_number
        - configuration
        - config_checksum
        - created_by
        - created_at
      type: object
    AgentDefinition:
      additionalProperties: false
      properties:
        avatar:
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        current_version_id:
          type: string
        deleted_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          type: string
        is_default:
          type: boolean
        is_primary:
          type: boolean
        name:
          type: string
        owner_id:
          type: string
        owner_type:
          type: string
        owner_user_id:
          type: string
        status:
          type: string
        tags:
          items:
            type: string
          type:
            - array
            - "null"
        updated_at:
          format: date-time
          type: string
        visibility:
          enum:
            - public
            - private
          type: string
        workspace_id:
          type: string
      required:
        - id
        - workspace_id
        - owner_id
        - owner_type
        - current_version_id
        - name
        - avatar
        - description
        - tags
        - visibility
        - status
        - is_default
        - is_primary
        - created_by
        - created_at
        - updated_at
      type: object
    AgentListResponse:
      additionalProperties: false
      properties:
        agents:
          description: 符合当前访问条件的 Agent
          items:
            $ref: "#/components/schemas/AgentDefinition"
          type:
            - array
            - "null"
      required:
        - agents
      type: object
    AgentRequest:
      additionalProperties: false
      properties:
        agent_id:
          description: 兼容旧客户端，服务端以请求路径为准
          type: string
        avatar:
          description: 头像
          type: string
        configuration:
          additionalProperties: false
          description: 运行配置，省略字段由 Agent 服务处理
          properties:
            enable_thinking:
              type: boolean
            evaluations:
              items:
                $ref: "#/components/schemas/EvaluationBinding"
              type:
                - array
                - "null"
            knowledge:
              items:
                $ref: "#/components/schemas/KnowledgeBinding"
              type:
                - array
                - "null"
            memory_policy: {}
            model:
              type: string
            models:
              items:
                $ref: "#/components/schemas/ModelBinding"
              type:
                - array
                - "null"
            prompts:
              items:
                $ref: "#/components/schemas/Slot"
              type:
                - array
                - "null"
            runtime_limits: {}
            soul_md:
              type: string
            tools:
              items:
                $ref: "#/components/schemas/ToolBinding"
              type:
                - array
                - "null"
          type: object
        description:
          description: 描述
          type: string
        expected_version_id:
          description: 更新时用于并发校验的当前版本 ID
          type: string
        name:
          description: Agent 名称
          type: string
        tags:
          description: 标签
          items:
            type: string
          type:
            - array
            - "null"
        visibility:
          description: 可见范围
          enum:
            - public
            - private
          type: string
      required:
        - name
        - visibility
      type: object
    AgentSaveResponse:
      additionalProperties: false
      properties:
        agent:
          $ref: "#/components/schemas/AgentDefinition"
          description: 保存后的 Agent
        config_checksum:
          description: 配置校验值
          type: string
        current_version_id:
          description: 当前配置版本 ID
          type: string
        version_number:
          description: 配置版本序号
          format: int64
          type: integer
      required:
        - agent
        - current_version_id
        - version_number
        - config_checksum
      type: object
    ApiError:
      additionalProperties: false
      properties:
        code:
          description: 稳定的错误码
          type: string
        message:
          description: 错误说明
          type: string
        request_id:
          description: 请求标识
          type: string
      required:
        - code
        - message
        - request_id
      type: object
    Configuration:
      additionalProperties: false
      properties:
        enable_thinking:
          type: boolean
        evaluations:
          items:
            $ref: "#/components/schemas/EvaluationBinding"
          type:
            - array
            - "null"
        knowledge:
          items:
            $ref: "#/components/schemas/KnowledgeBinding"
          type:
            - array
            - "null"
        memory_policy: {}
        model:
          type: string
        models:
          items:
            $ref: "#/components/schemas/ModelBinding"
          type:
            - array
            - "null"
        prompts:
          items:
            $ref: "#/components/schemas/Slot"
          type:
            - array
            - "null"
        runtime_limits: {}
        soul_md:
          type: string
        tools:
          items:
            $ref: "#/components/schemas/ToolBinding"
          type:
            - array
            - "null"
      required:
        - soul_md
        - model
        - models
        - tools
        - knowledge
        - evaluations
        - memory_policy
        - runtime_limits
      type: object
    CredentialsRequest:
      additionalProperties: false
      properties:
        display_name:
          description: 注册时使用的显示名称
          type: string
        email:
          description: 账号邮箱
          type: string
        password:
          description: 账号密码
          type: string
      required:
        - email
        - password
      type: object
    EvaluationBinding:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        rubric_id:
          type: string
      required:
        - rubric_id
        - enabled
      type: object
    KnowledgeBinding:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        filter:
          contentEncoding: base64
          type: string
        knowledge_base_id:
          type: string
      required:
        - knowledge_base_id
        - enabled
        - filter
      type: object
    LoginResponse:
      additionalProperties: false
      properties:
        token:
          description: 会话 Bearer 令牌
          type: string
        user:
          $ref: "#/components/schemas/UserResponse"
          description: 当前用户
      required:
        - token
        - user
      type: object
    ModelBinding:
      additionalProperties: false
      properties:
        capability:
          type: string
        model_profile_id:
          type: string
        revision:
          type: string
      required:
        - capability
        - model_profile_id
        - revision
      type: object
    Slot:
      additionalProperties: false
      properties:
        content:
          type: string
        enabled:
          type: boolean
        name:
          type: string
        order:
          format: int64
          type: integer
        scope:
          type: string
        variables:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
        - content
        - enabled
        - order
        - variables
        - scope
      type: object
    ToolBinding:
      additionalProperties: false
      properties:
        allowed_roles:
          items:
            type: string
          type:
            - array
            - "null"
        approval:
          type: string
        configuration: {}
        enabled:
          type: boolean
        max_calls:
          format: int64
          type: integer
        name:
          type: string
        timeout_ms:
          format: int64
          type: integer
        tool_version_id:
          type: string
      required:
        - name
        - enabled
      type: object
    UserResponse:
      additionalProperties: false
      properties:
        display_name:
          description: 显示名称
          type: string
        email:
          description: 账号邮箱
          type: string
        id:
          description: 用户 ID
          type: string
        role:
          description: 用户角色
          type: string
        workspace_id:
          description: 工作空间 ID
          type: string
      required:
        - id
        - email
        - display_name
        - role
        - workspace_id
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
info:
  title: xa 接口文档
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/agents:
    get:
      operationId: listAgents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证或 Agent 服务不可用（unauthenticated、agent_unavailable）
      security:
        - bearerAuth: []
      summary: 列出 Agent
      tags:
        - Agent 管理
    post:
      operationId: createAgent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSaveResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 请求 JSON 无效（invalid_json）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 没有 Agent 操作权限（agent_forbidden）
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 配置版本冲突（agent_conflict）
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Agent 信息或配置无效（invalid_agent）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证或 Agent 服务不可用（unauthenticated、agent_unavailable）
      security:
        - bearerAuth: []
      summary: 创建 Agent
      tags:
        - Agent 管理
  /api/v1/agents/{agent_id}:
    delete:
      operationId: deleteAgent
      parameters:
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            description: Agent ID
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 没有 Agent 操作权限（agent_forbidden）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Agent 或配置版本不存在（agent_not_found）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证或 Agent 服务不可用（unauthenticated、agent_unavailable）
      security:
        - bearerAuth: []
      summary: 删除 Agent
      tags:
        - Agent 管理
    get:
      operationId: getAgent
      parameters:
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            description: Agent ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDefinition"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 没有 Agent 操作权限（agent_forbidden）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Agent 或配置版本不存在（agent_not_found）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证或 Agent 服务不可用（unauthenticated、agent_unavailable）
      security:
        - bearerAuth: []
      summary: 获取 Agent
      tags:
        - Agent 管理
  /api/v1/agents/{agent_id}/config:
    get:
      operationId: getAgentConfig
      parameters:
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            description: Agent ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfigResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 没有 Agent 操作权限（agent_forbidden）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Agent 或配置版本不存在（agent_not_found）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证或 Agent 服务不可用（unauthenticated、agent_unavailable）
      security:
        - bearerAuth: []
      summary: 获取 Agent 当前配置
      tags:
        - Agent 管理
    put:
      operationId: saveAgent
      parameters:
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            description: Agent ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSaveResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 请求 JSON 无效（invalid_json）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 没有 Agent 操作权限（agent_forbidden）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Agent 或配置版本不存在（agent_not_found）
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 配置版本冲突（agent_conflict）
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Agent 信息或配置无效（invalid_agent）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证或 Agent 服务不可用（unauthenticated、agent_unavailable）
      security:
        - bearerAuth: []
      summary: 保存 Agent 配置
      tags:
        - Agent 管理
  /api/v1/agents/{agent_id}/enable:
    post:
      operationId: enableAgent
      parameters:
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            description: Agent ID
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 没有 Agent 操作权限（agent_forbidden）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Agent 或配置版本不存在（agent_not_found）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证或 Agent 服务不可用（unauthenticated、agent_unavailable）
      security:
        - bearerAuth: []
      summary: 启用 Agent
      tags:
        - Agent 管理
  /api/v1/agents/{agent_id}/offline:
    post:
      operationId: offlineAgent
      parameters:
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            description: Agent ID
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 没有 Agent 操作权限（agent_forbidden）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Agent 或配置版本不存在（agent_not_found）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证或 Agent 服务不可用（unauthenticated、agent_unavailable）
      security:
        - bearerAuth: []
      summary: 下线 Agent
      tags:
        - Agent 管理
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 请求 JSON 无效（invalid_json）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 凭证无效（invalid_credentials）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 用户已停用（user_disabled）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 用户或会话服务不可用（user_unavailable、session_unavailable）
      summary: 登录账号
      tags:
        - 认证
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证或会话服务不可用（unauthenticated、session_unavailable）
      security:
        - bearerAuth: []
      summary: 注销会话
      tags:
        - 认证
  /api/v1/auth/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证或用户服务不可用（unauthenticated、user_unavailable）
      security:
        - bearerAuth: []
      summary: 获取当前用户
      tags:
        - 认证
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 请求 JSON 无效（invalid_json）
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 用户已存在（user_exists）
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 用户信息无效（invalid_user）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 用户服务不可用（user_unavailable）
      summary: 注册账号
      tags:
        - 认证
  /api/v1/available-agents:
    get:
      operationId: availableAgents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Agent 服务不可用（agent_unavailable）
      security:
        - bearerAuth: []
        - {}
      summary: 获取公开可用 Agent
      tags:
        - Agent 管理
