  /api/v1/runs/{run_id}/events:
    get:
      description: 使用 v2 事件信封。读取 after 与有效 Last-Event-ID 两者中较大的序号之后的事件，连接可收到 SSE 注释心跳。
      operationId: subscribeRunEvents
      parameters:
        - description: 运行 ID
          in: path
          name: run_id
          required: true
          schema:
            type: string
        - description: 从此非负序号之后开始读取，默认 0
          in: query
          name: after
          schema:
            type: integer
        - description: 客户端已收到的最后事件序号
          in: header
          name: Last-Event-ID
          schema:
            type: integer
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                oneOf:
                  - additionalProperties: true
                    properties:
                      run_id:
                        type: string
                      seq:
                        format: int64
                        type: integer
                      step:
                        format: int64
                        type: integer
                      ts:
                        type: string
                      type:
                        type: string
                    required:
                      - seq
                      - run_id
                      - type
                      - ts
                    type: object
                  - $ref: "#/components/schemas/StreamError"
          description: SSE 事件流，Schema 描述每条事件的 data 字段
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 事件序号无效（invalid_after）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 运行不存在（not_found）
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 运行服务或流式响应不可用（run_unavailable、conversation_unavailable、stream_unsupported）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证服务不可用（unauthenticated）
      security:
        - bearerAuth: []
      summary: 订阅运行事件
      tags:
        - 运行
