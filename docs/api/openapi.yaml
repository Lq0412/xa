info:
  title: xa 接口文档
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/approvals:
    get:
      operationId: listAdminApprovals
      parameters:
        - description: 按审批状态筛选
          explode: false
          in: query
          name: status
          schema:
            description: 按审批状态筛选
            enum:
              - pending
              - approved
              - rejected
              - expired
              - cancelled
            type: string
        - description: 按工具名称筛选
          explode: false
          in: query
          name: tool_name
          schema:
            description: 按工具名称筛选
            type: string
        - description: 上一页返回的 next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: 上一页返回的 next_cursor
            type: string
        - description: 每页条数，范围 1 至 100，默认 50
          explode: false
          in: query
          name: limit
          schema:
            description: 每页条数，范围 1 至 100，默认 50
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRecordsPage"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 筛选或分页参数无效（invalid_status、invalid_limit）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 仅管理员可查看（forbidden）
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 审批记录不可用（approvals_unavailable）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证服务不可用（unauthenticated）
      security:
        - bearerAuth: []
      summary: 列出工作空间审批记录
      tags:
        - 审批
  /api/v1/admin/runs:
    get:
      operationId: listAdminRuns
      parameters:
        - description: 按会话 ID 筛选
          explode: false
          in: query
          name: conversation_id
          schema:
            description: 按会话 ID 筛选
            type: string
        - description: 按 Agent ID 筛选
          explode: false
          in: query
          name: agent_id
          schema:
            description: 按 Agent ID 筛选
            type: string
        - description: 按运行状态筛选
          explode: false
          in: query
          name: status
          schema:
            description: 按运行状态筛选
            enum:
              - queued
              - running
              - waiting_approval
              - completed
              - failed
              - cancelled
              - budget_exhausted
              - interrupted
            type: string
        - description: 按用户 ID 筛选，仅管理员可用
          explode: false
          in: query
          name: user_id
          schema:
            description: 按用户 ID 筛选，仅管理员可用
            type: string
        - description: 上一页返回的 next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: 上一页返回的 next_cursor
            type: string
        - description: 每页条数，范围 1 至 100，默认 20
          explode: false
          in: query
          name: limit
          schema:
            description: 每页条数，范围 1 至 100，默认 20
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 筛选或分页参数无效（invalid_request、invalid_limit）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 仅管理员可查看（forbidden）
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 运行查询不可用（conversation_unavailable）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 认证服务不可用（unauthenticated）
      security:
        - bearerAuth: []
      summary: 列出工作空间运行
      tags:
        - 运行
  /api/v1/admin/runs/{run_id}:
    get:
      operationId: getAdminRun
      parameters:
        - description: 运行 ID
          in: path
          name: run_id
          required: true
          schema:
            description: 运行 ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 会话无效（unauthenticated）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 仅管理员可查看（forbidden）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 运行不存在（not_found）
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 运行查询不可用（conversation_unavailable）
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
