name: xa

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${XA_POSTGRES_DATABASE:-xa}
      POSTGRES_USER: ${XA_POSTGRES_USER:-xa}
      POSTGRES_PASSWORD: ${XA_POSTGRES_PASSWORD:?请先生成 .env}
    ports:
      - "127.0.0.1:${XA_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${XA_REDIS_PASSWORD:?请先生成 .env}
    command: ["sh", "-ec", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports:
      - "127.0.0.1:${XA_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  object-store:
    image: rustfs/rustfs:1.0.0-alpha.72@sha256:f5b68544026308a53b71104c8cf56ae548472d0624ae4c9b32fc812292611ee8
    environment:
      RUSTFS_ACCESS_KEY: ${XA_S3_ACCESS_KEY:?请先生成 .env}
      RUSTFS_SECRET_KEY: ${XA_S3_SECRET_KEY:?请先生成 .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${XA_S3_PORT:-19000}:9000"
      - "127.0.0.1:${XA_S3_CONSOLE_PORT:-19001}:9001"
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  object-data:
